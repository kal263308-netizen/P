<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Cutie, Priyanshi</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #050505; /* Pure dark elegant theme */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Full Screen Fireworks Background */
        .bg-fireworks {
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.7)), 
                        url('https://unsplash.com') no-repeat center center/cover;
            animation: pulseBg 4s infinite alternate;
        }

        /* Tap to Open Box Screen */
        #envelope-screen {
            text-align: center;
            cursor: pointer;
            z-index: 10;
        }
        .gift-box {
            font-size: 110px;
            animation: bounce 2s infinite;
        }
        .tap-text {
            font-size: 1.4rem;
            color: #ffeb3b;
            font-weight: bold;
            margin-top: 15px;
            background: rgba(255, 255, 255, 0.1);
            padding: 12px 30px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(5px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }

        /* Main Greeting Container - No White Card Box */
        #main-content {
            display: none;
            max-width: 500px;
            width: 90%;
            background: transparent; 
            text-align: center;
            margin: 20px 0;
            z-index: 5;
            box-sizing: border-box;
        }

        h1 {
            color: #ff4081;
            font-size: 2.6rem;
            margin-bottom: 20px;
            text-shadow: 0 0 15px rgba(255,64,129,0.8);
        }

        /* Centered Single Photo Framework */
        .photo-container {
            display: flex;
            justify-content: center;
            margin: 25px 0;
        }
        .photo-box {
            width: 80%;
            max-width: 320px;
            height: auto;
            max-height: 400px;
            border-radius: 20px;
            object-fit: cover;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border: 4px solid #ffffff;
        }

        .message {
            font-size: 1.25rem;
            color: #ffffff;
            line-height: 1.6;
            text-shadow: 2px 2px 4px rgba(0,0,0,1);
        }

        .apology {
            font-size: 1.15rem;
            color: #f0f0f0;
            border-top: 1px solid rgba(255,255,255,0.3);
            padding-top: 20px;
            margin-top: 25px;
            font-style: italic;
            text-shadow: 2px 2px 4px rgba(0,0,0,1);
            line-height: 1.5;
        }

        .wishes {
            font-size: 1.45rem;
            font-weight: bold;
            color: #69f0ae;
            margin-top: 20px;
            text-shadow: 0 0 12px rgba(105,240,174,0.7);
        }

        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        @keyframes pulseBg {
            0% { filter: brightness(0.7); }
            100% { filter: brightness(1.15); }
        }
    </style>
</head>
<body>

    <!-- STEP 1: Tap to Open Screen -->
    <div id="envelope-screen" onclick="openWish()">
        <div class="gift-box">🎁</div>
        <div class="tap-text">Tap to Open ✨</div>
    </div>

    <!-- STEP 2: Main Birthday Page (Revealed on Tap) -->
    <div id="main-content">
        <h1>Happy Birthday, Cutie, Priyanshi! 🎉</h1>
        
        <div class="photo-container">
            <!-- Yeh photo GitHub par upload ki hui darshana.jpg se chalegi -->
            <img class="photo-box" src="darshana.jpg" alt="Darshana Photo">
        </div>

        <p class="message">
            Wishing you a wonderful day ahead filled with peace and happiness. 🌟
        </p>

        <div class="apology">
            "I'm so sorry if I made you feel uncomfortable, I'm so sorry 😔"
        </div>

        <p class="wishes">
            Enjoy your day 😊
        </p>
    </div>

    <script>
        function openWish() {
            document.getElementById('envelope-screen').style.display = 'none';
            const mainContent = document.getElementById('main-content');
            mainContent.style.display = 'block';
            document.body.classList.add('bg-fireworks');
        }
    </script>
</body>
</html>
